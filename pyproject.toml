[project]
name = "scamsentry-ai"
version = "1.0.0"
description = "AI-powered SMS and message scam detection platform using machine learning and explainable risk analysis."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]
